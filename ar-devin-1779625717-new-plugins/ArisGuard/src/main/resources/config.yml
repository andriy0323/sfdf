# ╔══════════════════════════════════════════════════════════════╗
# ║              ArisGuard — конфигурация                         ║
# ║              защита от DDoS / flood + защита OP              ║
# ╚══════════════════════════════════════════════════════════════╝

# ────────────────────────────────────────────────────────────────
# DDoS / flood-protection
# ────────────────────────────────────────────────────────────────
ddos:
  enabled: true

  # Максимум попыток подключения с одного IP за окно (window-seconds).
  max-attempts: 5
  window-seconds: 10

  # Сколько секунд держать IP в бане после превышения.
  block-seconds: 60

  # Максимум одновременно онлайн игроков с одного IP.
  max-concurrent-per-ip: 3

  # Сообщение при отказе в подключении.
  kick-message: "&cСлишком много подключений. Попробуйте позже."
  blacklist-message: "&cВаш IP в чёрном списке."

  # Постоянный чёрный список IP (любые подключения отклоняются).
  ip-blacklist: []

# ────────────────────────────────────────────────────────────────
# OP-Guard — защита от несанкционированного оператора (OP).
# Любой игрок, получивший OP но НЕ входящий в allowed-ops, будет
# автоматически разоп-нут и об этом будет уведомлён лог сервера.
# ────────────────────────────────────────────────────────────────
op-guard:
  enabled: true

  # Разрешённые операторы — никнеймы (без учёта регистра).
  allowed-ops:
    - AndryshaOff

  # Перехватывать команду /op (и /minecraft:op) от игроков:
  # если игрок не в allowed-ops, команда отменяется.
  # Консоль (RCON / server console) не ограничивается, но любой выданный
  # OP всё равно проверяется сканером ниже и разоп-нется, если ник не в списке.
  intercept-op-command: true

  # Интервал сканирования операторов (секунды). 0 = выключить периодический скан.
  scan-interval-seconds: 5

  # Логировать обнаружение несанкционированного OP в консоль.
  alert-on-detection: true
