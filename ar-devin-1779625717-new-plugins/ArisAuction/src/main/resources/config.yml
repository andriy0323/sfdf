# ║              ArisAuction — конфигурация                      ║
# ╚══════════════════════════════════════════════════════════════╝

# Максимальное количество лотов на игрока
max-listings: 10

# Налог на продажу (в %)
tax-percent: 5.0

# Время жизни лота (минуты)
listing-expire-minutes: 1440

# Минимальная/максимальная цена
min-price: 1.0
max-price: 10000000.0

# Количество слотов на странице в GUI
page-size: 45
