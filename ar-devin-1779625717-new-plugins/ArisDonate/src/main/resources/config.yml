# Версия конфига — не меняй вручную. Плагин делает резервную копию
# и подменяет конфиг, если на диске лежит старая версия.
config-version: 3

default-home-limit: 1
discord-url: "https://discord.gg/your-server"
shop-links: []

# ────────────────────────────────────────────────────────────────
# 11 ДОНАТОВ — ArisPlus самый мощный.
# Каждый ранг даёт:
#   display-name   — текст-префикс (через scoreboard team)
#   start-hex/end-hex — RGB градиент
#   region-limit   — сколько регионов разрешено
#   home-limit     — сколько /sethome'ов можно создать
#   weight         — вес ранга (выше = мощнее, для tab)
#   shulker        — иконка в /donate GUI
#   description    — текст-описание (поддерживает &-коды + <grad:...>)
#   commands       — список команд для отображения в lore
#   gui-slot       — слот в /donate GUI (0..53)
#   kit            — id кита (см. секцию kits)
# ────────────────────────────────────────────────────────────────
